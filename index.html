<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Ladduuu ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: 'Poppins', sans-serif;
  text-align: center;
  color: #fff;
}

.container {
  position: relative;
  z-index: 2;
  top: 30%;
  padding: 20px;
}

h1 {
  font-size: 2.2rem;
}
h2 {
  font-size: 1.4rem;
}

button {
  padding: 14px 22px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  margin: 15px;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.95);
}

#yes {
  background: #ff4d88;
  color: white;
}

#no {
  background: white;
  color: #ff4d88;
  position: absolute;
}

/* HEART RAIN */
.heart {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Hey Ladduuu 💖</h1>
  <h2>Will you be my Valentine? 🌹</h2>

  <button id="yes" onclick="yesClick()">YES 💕</button>
  <button id="no" onclick="moveNo()">NO 😜</button>
</div>

<script>
// NO button movement (mobile smooth)
function moveNo() {
  const no = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  no.style.left = x + "px";
  no.style.top = y + "px";
}

// YES click action
function yesClick() {
  document.body.innerHTML = `
  <div style="color:white;text-align:center;top:35%;position:relative;">
    <h1>YAYYYY 🥹❤️</h1>
    <h2>I knew it, Ladduuu!</h2>
    <p>You just made my heart so happy 💖</p>
    <p>Happy Valentine’s Day 🌹</p>
  </div>`;
}

// HEART RAIN FUNCTION
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
